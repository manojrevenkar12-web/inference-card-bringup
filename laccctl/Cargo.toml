[package]
name = "laccctl"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Bring-up and service tool for the LACC inference card: status, firmware update, traces, registers, faults"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 2
debug = false
strip = true
