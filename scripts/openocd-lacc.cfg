# OpenOCD talks to the card's JTAG TAP through QEMU's remote_bitbang socket.
adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port 3335
transport select jtag
# IR: 1 IDCODE, 2 DBG_ADDR, 3 DBG_DATA (33 bits: data, bit 32 = write), 0xF BYPASS
jtag newtap lacc tap -irlen 4 -ircapture 0x1 -irmask 0x3 -expected-id 0x1acc0001
gdb_port disabled
telnet_port disabled
tcl_port 6666
